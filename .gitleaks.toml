title = "garminizer gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "private-ipv4"
description = "Private network IPv4 address (hosts belong in .env, never in tracked files)"
regex = '''\b(?:10\.\d{1,3}|192\.168|172\.(?:1[6-9]|2\d|3[01]))\.\d{1,3}\.\d{1,3}\b'''
keywords = ["10.", "192.168", "172."]

[[rules]]
id = "garmin-oauth-token"
description = "Garmin OAuth access/refresh token in a JSON token store"
regex = '''(?i)"(?:access_token|refresh_token|di_token|di_refresh_token|oauth_token_secret)"\s*:\s*"[A-Za-z0-9._~+/=-]{24,}"'''
keywords = ["token"]

[[rules]]
id = "app-password-assignment"
description = "A real APP_PASSWORD / GARMIN_PASSWORD value assigned in a tracked file"
regex = '''(?i)\b(?:APP_PASSWORD|GARMIN_PASSWORD|POSTGRES_PASSWORD|APP_SECRET_KEY)[ \t]*=[ \t]*["']?[^\s"'#]{8,}'''
keywords = ["password", "secret_key"]

[allowlist]
description = "Rule definitions themselves and documented placeholders"
paths = ['''^\.gitleaks\.toml$''', '''^scripts/secret_scan\.sh$''']
regexes = ['''change-me''', '''demo-password''', '''example''']
