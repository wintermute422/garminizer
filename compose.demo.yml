# Try Garminizer without a Garmin account: two years of a synthetic athlete.
#   docker compose -f compose.demo.yml up -d --build   ->  http://localhost:8430
# Separate project, database and port; it never touches your real data.
name: garminizer-demo

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: garminizer
      POSTGRES_PASSWORD: demo-password
      POSTGRES_DB: garminizer
    volumes:
      - demo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U garminizer -d garminizer"]
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build: .
    image: garminizer:local
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://garminizer:demo-password@db:5432/garminizer
      APP_HOST: 127.0.0.1
      APP_PORT: "8420"
      LISTEN_HOST: 0.0.0.0
      DATA_DIR: /tmp/garminizer-demo
    ports:
      - "127.0.0.1:${DEMO_PORT:-8430}:8420"
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "garminizer demo seed --if-empty && exec garminizer serve"]

volumes:
  demo-pgdata:
