name: Release

# Pushing a tag vX.Y.Z from main publishes ghcr.io/<owner>/garminizer:X.Y.Z (+ X.Y, latest) for
# x86-64 and ARM64 and creates the GitHub release from that version's CHANGELOG.md section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Publish image and GitHub release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tag, package version and changelog agree
        run: python scripts/release_notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME" install.cmd install.ps1 --verify-tag
          --title "Garminizer ${GITHUB_REF_NAME#v}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
